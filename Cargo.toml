[package]
name = "seography-bug"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm = { version = "1.1.2", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "mock",
] }
seaography = { version = "1.1.1", features = [
    "with-decimal",
    "with-chrono",
    "with-uuid",
    "field-snake-case",
] }
